name: Build and publish UK pub snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool

      - name: Install tile-builder dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run tile-builder tests
        run: python -m unittest discover -s server/tests

      - name: Download current United Kingdom extract
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            --output united-kingdom-latest.osm.pbf \
            https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf

      - name: Filter pubs and export GeoJSON
        run: |
          osmium tags-filter united-kingdom-latest.osm.pbf nwr/amenity=pub \
            --output pubs.osm.pbf --overwrite
          osmium export pubs.osm.pbf --geometry-types=point,polygon \
            --output pubs.geojson --overwrite

      - name: Build and validate static tiles
        run: |
          python server/build_tiles.py \
            --input pubs.geojson \
            --output site \
            --built "$(date -u +%F)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
